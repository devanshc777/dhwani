<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhwani — everything you said</title>
<style>
  :root {
    --bg: #0b0812; --panel: #141020; --panel-2: #191430; --line: #251e3a;
    --text: #ede9f5; --dim: #8e86a6; --accent: #a78bfa; --hi: #ede9fe;
    --serif: Georgia, "Times New Roman", serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.6 "Segoe UI", system-ui, sans-serif; padding: 44px 20px 90px;
  }
  body::before {
    content: ""; position: fixed; inset: -25% -15% auto; height: 50%;
    background: radial-gradient(ellipse at 50% 0%, #241852aa, transparent 70%);
    pointer-events: none;
  }
  main { max-width: 700px; margin: 0 auto; position: relative; }

  header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 4px; }
  .wordmark { font-family: var(--serif); font-size: 34px; letter-spacing: .5px; font-weight: 400; }
  .wordmark .dev { color: var(--accent); font-size: 22px; margin-left: 6px; }
  .status { margin-left: auto; font: 12.5px var(--mono); color: var(--dim);
            display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a4460; transition: background .3s; }
  .dot.ready { background: var(--accent); }
  .dot.rec { background: var(--hi); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* signature: the wordmark's living underline — breathes while recording */
  #pulse { display: block; margin: 2px 0 30px; height: 18px; width: 200px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
  }

  .card h2 {
    font: 400 12px var(--mono); color: var(--dim); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 4px;
  }
  .hint { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; font: 13px var(--mono);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px;
    padding: 4px 6px 4px 12px; color: var(--hi);
  }
  .chip button {
    all: unset; cursor: pointer; color: var(--dim); font-size: 12px;
    width: 17px; height: 17px; text-align: center; border-radius: 50%;
  }
  .chip button:hover { color: var(--hi); background: var(--line); }
  .addrow { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: 14px "Segoe UI", sans-serif; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent); color: #17102e; border: none; border-radius: 8px;
    padding: 8px 18px; font: 600 14px "Segoe UI", sans-serif; cursor: pointer;
  }
  .btn:hover { background: var(--hi); }

  .searchrow { margin: 26px 0 14px; }

  .day {
    font: 400 12px var(--mono); color: var(--dim); text-transform: uppercase;
    letter-spacing: 1.5px; margin: 26px 2px 10px;
  }
  .entry {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 18px; margin-bottom: 10px;
  }
  .meta { display: flex; gap: 14px; align-items: baseline; font: 12px var(--mono);
          color: var(--dim); margin-bottom: 7px; }
  .copy {
    all: unset; cursor: pointer; margin-left: auto; color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 11px; font: 12px var(--mono);
  }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  .txt { white-space: pre-wrap; word-wrap: break-word; }
  details { margin-top: 9px; }
  summary { font: 12px var(--mono); color: var(--dim); cursor: pointer; }
  .raw { font-size: 13px; color: var(--dim); white-space: pre-wrap; margin-top: 6px; }
  .empty { color: var(--dim); text-align: center; padding: 70px 0; font-family: var(--serif); font-size: 17px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="wordmark">dhwani<span class="dev">ध्वनि</span></h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statustext">connecting</span></div>
  </header>
  <canvas id="pulse" width="400" height="36"></canvas>

  <section class="card">
    <h2>Context words</h2>
    <p class="hint">Names and jargon to spell correctly — whisper reads these before every utterance.</p>
    <div class="chips" id="chips"></div>
    <div class="addrow">
      <input type="text" id="newword" placeholder="Add a name, product, term…" maxlength="60">
      <button class="btn" id="addbtn">Add</button>
    </div>
  </section>

  <div class="searchrow">
    <input type="text" id="search" placeholder="Search everything you said…">
  </div>
  <div id="list"><p class="empty">Nothing yet. Press the hotkey and say something.</p></div>
</main>
<script>
  let items = [], words = [], recording = false;

  // ---------- signature underline: breathes while recording ----------
  const pc = document.getElementById("pulse"), pctx = pc.getContext("2d");
  let t = 0;
  function drawPulse() {
    t += recording ? 0.11 : 0.015;
    pctx.clearRect(0, 0, pc.width, pc.height);
    pctx.beginPath();
    const mid = pc.height / 2, amp = recording ? 9 : 1.6;
    for (let x = 0; x <= pc.width; x += 3) {
      const env = Math.sin((x / pc.width) * Math.PI);           // taper at ends
      const y = mid + Math.sin(x * 0.045 + t) * amp * env;
      x === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    }
    pctx.strokeStyle = recording ? "#ede9fe" : "#a78bfa";
    pctx.lineWidth = 1.6;
    pctx.stroke();
    requestAnimationFrame(drawPulse);
  }
  drawPulse();

  // ---------- context words ----------
  const chips = document.getElementById("chips");
  function renderChips() {
    chips.innerHTML = "";
    for (const w of words) {
      const el = document.createElement("span");
      el.className = "chip";
      el.textContent = w + " ";
      const x = document.createElement("button");
      x.textContent = "×";
      x.title = "Remove";
      x.onclick = async () => {
        words = await fetch("/api/prompt/" + encodeURIComponent(w), { method: "DELETE" }).then(r => r.json());
        renderChips();
      };
      el.appendChild(x);
      chips.appendChild(el);
    }
  }
  async function addWord() {
    const inp = document.getElementById("newword");
    const w = inp.value.trim();
    if (!w) return;
    words = await fetch("/api/prompt/" + encodeURIComponent(w), { method: "POST" }).then(r => r.json());
    inp.value = "";
    renderChips();
  }
  document.getElementById("addbtn").onclick = addWord;
  document.getElementById("newword").addEventListener("keydown", e => { if (e.key === "Enter") addWord(); });

  // ---------- transcripts ----------
  const dayName = ts => {
    const d = new Date(ts * 1000), now = new Date();
    const day = d.toDateString();
    if (day === now.toDateString()) return "Today";
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (day === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { day: "numeric", month: "long" });
  };
  const timeOf = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const list = document.getElementById("list");
    const shown = q ? items.filter(t => t.text.toLowerCase().includes(q)) : items;
    if (!shown.length) {
      list.innerHTML = `<p class="empty">${q ? "No match for that." : "Nothing yet. Press the hotkey and say something."}</p>`;
      return;
    }
    list.innerHTML = "";
    let lastDay = "";
    for (const t of shown) {
      const day = dayName(t.created_at);
      if (day !== lastDay) {
        const h = document.createElement("div");
        h.className = "day"; h.textContent = day;
        list.appendChild(h); lastDay = day;
      }
      const el = document.createElement("div");
      el.className = "entry";
      const showRaw = t.raw.trim() !== t.text.trim();
      el.innerHTML = `
        <div class="meta"><span>${timeOf(t.created_at)}</span><span>${t.duration_s}s</span>
          <button class="copy">copy</button></div>
        <div class="txt"></div>
        ${showRaw ? '<details><summary>raw whisper output</summary><div class="raw"></div></details>' : ""}`;
      el.querySelector(".txt").textContent = t.text;
      if (showRaw) el.querySelector(".raw").textContent = t.raw;
      el.querySelector(".copy").onclick = e => {
        navigator.clipboard.writeText(t.text);
        e.target.textContent = "copied";
        setTimeout(() => (e.target.textContent = "copy"), 1200);
      };
      list.appendChild(el);
    }
  }
  document.getElementById("search").addEventListener("input", render);

  // ---------- polling ----------
  async function poll() {
    try {
      const [status, tr] = await Promise.all([
        fetch("/api/status").then(r => r.json()),
        fetch("/api/transcripts").then(r => r.json()),
      ]);
      recording = status.recording;
      const dot = document.getElementById("dot");
      dot.className = "dot" + (status.recording ? " rec" : status.model_ready ? " ready" : "");
      document.getElementById("statustext").textContent =
        status.recording ? "listening" :
        status.model_ready ? `${status.hotkey} · whisper ${status.model_size}` : "loading model";
      items = tr; render();
    } catch { document.getElementById("statustext").textContent = "app not running"; }
    setTimeout(poll, 2000);
  }
  fetch("/api/prompt").then(r => r.json()).then(w => { words = w; renderChips(); });
  poll();
</script>
</body>
</html>
