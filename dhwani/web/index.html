<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhwani — everything you said</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d3d2f'/%3E%3Cpath d='M6 16 Q9 10 12 16 T18 16 T24 16' stroke='%23b9e0c3' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Wispr-Flow-family language: warm paper page, one deep-forest capsule panel,
     bookish serif display. Single theme (light paper), locked. No build step. */
  :root {
    --paper: #f6f2e8; --paper-2: #efe9db;
    --ink: #17251d; --ink-soft: #35443a; --dim: #6f7d70;
    --forest: #1d3d2f; --forest-2: #274d3b; --forest-line: #33604a;
    --mint: #b9e0c3; --sage: #e3ecdd; --sage-line: #c9d8c4;
    --cream: #f3eddd; --line: rgba(23, 37, 29, .14);
    --serif: "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    --mono: "Cascadia Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--paper); color: var(--ink); min-height: 100vh;
    font: 15px/1.6 var(--sans); padding: 36px 20px 110px;
  }
  main { max-width: 720px; margin: 0 auto; }

  /* ---- the capsule: dark forest panel, the app's one dark object ---- */
  .capsule {
    background: var(--forest); color: var(--cream); border-radius: 28px;
    padding: 26px 30px 18px; box-shadow: 0 12px 40px rgba(23, 37, 29, .18);
    transition: box-shadow .5s ease;
  }
  .capsule.rec { box-shadow: 0 12px 48px rgba(29, 61, 47, .38); }
  .caprow { display: flex; align-items: baseline; gap: 14px; }
  .wordmark { font-family: var(--serif); font-size: 38px; font-weight: 400; letter-spacing: .3px; }
  .wordmark .dev { color: var(--mint); font-size: 24px; margin-left: 8px; }
  .status {
    margin-left: auto; font: 12.5px var(--mono); color: var(--mint);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--forest-line); transition: background .3s; }
  .dot.ready { background: var(--mint); }
  .dot.rec { background: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #pulse { display: block; width: 100%; height: 44px; margin-top: 6px; }
  .hotkeyline { font: 12px var(--mono); color: rgba(243, 237, 221, .55); margin-top: 2px; }
  .hotkeyline kbd {
    font: 11px var(--mono); background: var(--forest-2); border: 1px solid var(--forest-line);
    border-radius: 6px; padding: 1px 7px; color: var(--cream);
  }

  /* ---- dictionary (context words), Wispr-style green pills ---- */
  .dict { margin: 34px 0 6px; }
  .dict h2 { font-family: var(--serif); font-size: 20px; font-weight: 400; margin-bottom: 4px; }
  .hint { font-size: 13px; color: var(--dim); margin-bottom: 14px; max-width: 55ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; font: 13.5px var(--sans);
    background: var(--sage); border: 1px solid var(--sage-line); border-radius: 999px;
    padding: 5px 8px 5px 14px; color: var(--ink);
  }
  .chip button {
    all: unset; cursor: pointer; color: var(--dim); font-size: 13px; line-height: 1;
    width: 18px; height: 18px; text-align: center; border-radius: 50%;
  }
  .chip button:hover { color: var(--ink); background: var(--sage-line); }
  .addrow { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: #fff; color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 18px; font: 14px var(--sans); outline: none;
    transition: border-color .2s;
  }
  input[type=text]::placeholder { color: var(--dim); }
  input[type=text]:focus { border-color: var(--forest); }
  .btn {
    background: var(--forest); color: var(--cream); border: none; border-radius: 999px;
    padding: 9px 22px; font: 600 14px var(--sans); cursor: pointer;
  }
  .btn:hover { background: var(--forest-2); }
  .btn:active { transform: translateY(1px); }

  .searchrow { margin: 34px 0 6px; }
  .searchrow input { width: 100%; }

  /* ---- history: paper entries under serif day heads ---- */
  .day {
    font-family: var(--serif); font-size: 17px; color: var(--ink-soft);
    margin: 30px 2px 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .entry { padding: 15px 2px 13px; border-bottom: 1px solid var(--line); }
  .meta { display: flex; gap: 14px; align-items: baseline; font: 12px var(--mono);
          color: var(--dim); margin-bottom: 6px; }
  .copy {
    all: unset; cursor: pointer; margin-left: auto; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 13px; font: 12px var(--mono);
    transition: color .2s, border-color .2s;
  }
  .copy:hover { color: var(--forest); border-color: var(--forest); }
  .txt { white-space: pre-wrap; word-wrap: break-word; font-size: 15.5px; }
  details { margin-top: 8px; }
  summary { font: 12px var(--mono); color: var(--dim); cursor: pointer; }
  .raw { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; margin-top: 6px;
         background: var(--paper-2); border-radius: 10px; padding: 10px 14px; }
  .empty {
    color: var(--dim); text-align: center; padding: 80px 0 60px;
    font-family: var(--serif); font-size: 19px;
  }
  .empty kbd {
    font: 14px var(--mono); background: var(--cream); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 8px; color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.rec { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section class="capsule" id="capsule">
    <div class="caprow">
      <h1 class="wordmark">dhwani<span class="dev">ध्वनि</span></h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statustext">connecting</span></div>
    </div>
    <canvas id="pulse" width="1320" height="88"></canvas>
    <div class="hotkeyline">press <kbd id="hotkey">…</kbd> to start and stop dictating, anywhere in Windows</div>
  </section>

  <section class="dict">
    <h2>Dictionary</h2>
    <p class="hint">Names and jargon whisper should spell correctly. It reads these before every utterance.</p>
    <div class="chips" id="chips"></div>
    <div class="addrow">
      <input type="text" id="newword" placeholder="Add a name, product, term" maxlength="60">
      <button class="btn" id="addbtn">Add</button>
    </div>
  </section>

  <div class="searchrow">
    <input type="text" id="search" placeholder="Search everything you said">
  </div>
  <div id="list"><p class="empty">Nothing yet. Press <kbd class="k">the hotkey</kbd> and say something.</p></div>
</main>
<script>
  let items = [], words = [], recording = false, hotkeyLabel = "the hotkey";

  // ---------- capsule waveform: idle whisper, breathes while recording ----------
  const pc = document.getElementById("pulse"), pctx = pc.getContext("2d");
  function sizeCanvas() {
    const w = pc.clientWidth || 660;
    pc.width = w * 2; pc.height = 88;   // 2x for crispness
  }
  sizeCanvas();
  addEventListener("resize", sizeCanvas);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  function drawPulse() {
    t += recording ? 0.11 : 0.014;
    pctx.clearRect(0, 0, pc.width, pc.height);
    pctx.beginPath();
    const mid = pc.height / 2, amp = recording ? 22 : 4;
    for (let x = 0; x <= pc.width; x += 4) {
      const env = Math.sin((x / pc.width) * Math.PI);            // taper at ends
      const y = mid + Math.sin(x * 0.02 + t) * amp * env
                    + Math.sin(x * 0.043 - t * 1.7) * amp * 0.35 * env;
      x === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    }
    pctx.strokeStyle = recording ? "#ffffff" : "#b9e0c3";
    pctx.lineWidth = 2.4;
    pctx.stroke();
    if (!reduceMotion) requestAnimationFrame(drawPulse);
  }
  drawPulse();

  // ---------- dictionary ----------
  const chips = document.getElementById("chips");
  function renderChips() {
    chips.innerHTML = "";
    for (const w of words) {
      const el = document.createElement("span");
      el.className = "chip";
      el.textContent = w + " ";
      const x = document.createElement("button");
      x.textContent = "×";
      x.title = "Remove";
      x.onclick = async () => {
        words = await fetch("/api/prompt/" + encodeURIComponent(w), { method: "DELETE" }).then(r => r.json());
        renderChips();
      };
      el.appendChild(x);
      chips.appendChild(el);
    }
  }
  async function addWord() {
    const inp = document.getElementById("newword");
    const w = inp.value.trim();
    if (!w) return;
    words = await fetch("/api/prompt/" + encodeURIComponent(w), { method: "POST" }).then(r => r.json());
    inp.value = "";
    renderChips();
  }
  document.getElementById("addbtn").onclick = addWord;
  document.getElementById("newword").addEventListener("keydown", e => { if (e.key === "Enter") addWord(); });

  // ---------- transcripts ----------
  const dayName = ts => {
    const d = new Date(ts * 1000), now = new Date();
    const day = d.toDateString();
    if (day === now.toDateString()) return "Today";
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (day === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { day: "numeric", month: "long" });
  };
  const timeOf = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const list = document.getElementById("list");
    const shown = q ? items.filter(t => t.text.toLowerCase().includes(q)) : items;
    if (!shown.length) {
      list.innerHTML = q
        ? `<p class="empty">No match for that.</p>`
        : `<p class="empty">Nothing yet. Press <kbd>${hotkeyLabel}</kbd> and say something.</p>`;
      return;
    }
    list.innerHTML = "";
    let lastDay = "";
    for (const t of shown) {
      const day = dayName(t.created_at);
      if (day !== lastDay) {
        const h = document.createElement("div");
        h.className = "day"; h.textContent = day;
        list.appendChild(h); lastDay = day;
      }
      const el = document.createElement("div");
      el.className = "entry";
      const showRaw = t.raw.trim() !== t.text.trim();
      el.innerHTML = `
        <div class="meta"><span>${timeOf(t.created_at)}</span><span>${t.duration_s}s</span>
          <button class="copy">copy</button></div>
        <div class="txt"></div>
        ${showRaw ? '<details><summary>raw whisper output</summary><div class="raw"></div></details>' : ""}`;
      el.querySelector(".txt").textContent = t.text;
      if (showRaw) el.querySelector(".raw").textContent = t.raw;
      el.querySelector(".copy").onclick = e => {
        navigator.clipboard.writeText(t.text);
        e.target.textContent = "copied";
        setTimeout(() => (e.target.textContent = "copy"), 1200);
      };
      list.appendChild(el);
    }
  }
  document.getElementById("search").addEventListener("input", render);

  // ---------- polling ----------
  async function poll() {
    try {
      const [status, tr] = await Promise.all([
        fetch("/api/status").then(r => r.json()),
        fetch("/api/transcripts").then(r => r.json()),
      ]);
      recording = status.recording;
      hotkeyLabel = (status.hotkey || "the hotkey").replace(/\b\w/g, c => c.toUpperCase());
      document.getElementById("hotkey").textContent = hotkeyLabel;
      document.getElementById("capsule").classList.toggle("rec", recording);
      const dot = document.getElementById("dot");
      dot.className = "dot" + (status.recording ? " rec" : status.model_ready ? " ready" : "");
      document.getElementById("statustext").textContent =
        status.recording ? "listening" :
        status.model_ready ? `whisper ${status.model_size} · ready` : "loading model";
      items = tr; render();
    } catch { document.getElementById("statustext").textContent = "app not running"; }
    setTimeout(poll, 2000);
  }
  fetch("/api/prompt").then(r => r.json()).then(w => { words = w; renderChips(); });
  poll();
</script>
</body>
</html>
